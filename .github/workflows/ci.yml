name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Run Test Suite
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/job_portal_test
          JWT_SECRET: test_jwt_secret_key_ci_environment
          PORT: 5001
        run: npm test

      - name: Build Frontend Production Bundle
        run: npm --prefix client run build
